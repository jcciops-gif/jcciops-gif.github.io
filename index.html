<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<title>تقويم فعاليات غرفة جدة</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
  /* ألوان هوية غرفة جدة */
  :root{
    --blue:#1c6792; --blue-dark:#114a6b; --mid:#0e7da4; --teal:#2ec0c9; --teal-soft:#e6f7f8;
    --orange:#ffab22;
    --bg:#f1f5f7; --card:#fff; --text:#16303d; --muted:#6b7f89; --line:#e2eaee;
    --r:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;font-size:15px}
  button{font-family:inherit}
  .wrap{max-width:980px;margin:0 auto;width:100%;padding:0 16px}

  /* الشريط العلوي */
  .topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top)}
  .topbar .wrap{display:flex;align-items:center;gap:12px;height:66px}
  .topbar img{height:46px;display:block}
  .topbar .sep{width:1px;height:30px;background:var(--line)}
  .topbar b{font-size:16px;color:var(--blue);font-weight:800;line-height:1.2}
  .topbar small{display:block;font-size:12px;color:var(--muted);font-weight:500}

  /* الفعالية القادمة */
  .hero{background:linear-gradient(140deg,var(--blue-dark),var(--blue) 55%,var(--mid));color:#fff;position:relative;overflow:hidden;padding:22px 0 70px}
  .hero::before,.hero::after{content:"";position:absolute;background:var(--teal);transform:rotate(45deg);border-radius:14px;opacity:.9}
  .hero::before{width:90px;height:90px;left:-26px;bottom:26px;opacity:.25}
  .hero::after{width:26px;height:26px;left:70px;top:22px;opacity:.7;border-radius:6px}
  .eyebrow{font-size:13px;color:#bfe9ee;font-weight:500;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .eyebrow::before{content:"";width:8px;height:8px;background:var(--teal);transform:rotate(45deg);border-radius:2px}
  .feat{display:flex;gap:14px;align-items:center;cursor:pointer;position:relative;z-index:1}
  .feat .ph{width:92px;height:92px;flex:none;border-radius:16px;background:rgba(255,255,255,.12) center/cover;border:2px solid rgba(255,255,255,.25)}
  .feat h2{font-size:20px;font-weight:800;line-height:1.35}
  .feat p{font-size:13.5px;opacity:.85;margin-top:4px}
  .pill{display:inline-block;margin-top:8px;background:var(--teal);color:#06343b;font-weight:700;font-size:12.5px;padding:4px 10px;border-radius:999px}
  .hero .none{font-size:16px;opacity:.9;position:relative;z-index:1}
  .feat{min-height:92px}
  .feat h2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .feat.in{animation:heroIn .55s ease}
  @keyframes heroIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
  .hdots{display:flex;gap:6px;margin-top:14px;position:relative;z-index:1}
  .hdots i{width:8px;height:8px;border-radius:999px;background:rgba(255,255,255,.35);cursor:pointer;transition:width .3s,background .3s}
  .hdots i.on{width:22px;background:var(--teal)}
  .eyebrow .cnt{opacity:.75;font-weight:400}

  main{flex:1;margin-top:-50px;position:relative;z-index:2;padding-bottom:24px}

  /* التقويم */
  .cal{background:var(--card);border-radius:var(--r);box-shadow:0 10px 30px rgba(17,74,107,.10);overflow:hidden}
  .nav{display:flex;align-items:center;gap:8px;padding:12px}
  .nav .m{flex:1;text-align:center}
  .nav .m b{display:block;font-size:18px;font-weight:800}
  .nav .m span{font-size:12px;color:var(--muted);white-space:nowrap}
  .nav .m{min-width:0}
  .ib{width:42px;height:42px;border-radius:12px;border:0;background:var(--teal-soft);color:var(--blue);display:grid;place-items:center;cursor:pointer}
  .ib svg{width:20px;height:20px}
  .tb{height:42px;border-radius:12px;border:0;background:var(--teal-soft);color:var(--blue);font-weight:700;font-size:13.5px;padding:0 12px;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:0 8px 10px}
  .dow{text-align:center;font-size:12px;color:var(--muted);padding:6px 0 8px;font-weight:500}
  .day{min-width:0;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4px;cursor:pointer;border-radius:12px;position:relative;user-select:none}
  .day .n{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;font-weight:700;font-size:15px}
  .day .top{text-align:center}
  .day .h{font-size:9.5px;color:var(--muted);display:block;line-height:1.2}
  .day.out{opacity:.3}
  .day.today .n{box-shadow:inset 0 0 0 2px var(--teal);color:var(--blue)}
  .day.sel .n{background:var(--blue);color:#fff;box-shadow:none}
  .dots{position:absolute;bottom:2px;display:flex;gap:3px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--teal)}
  .day.sel .dots i{background:var(--orange)}
  .chips{display:none}

  /* أجندة اليوم المختار */
  .agenda{border-top:1px solid var(--line);padding:14px 14px 16px}
  .agenda h3{font-size:14px;color:var(--muted);font-weight:500;margin-bottom:10px}
  .agenda .empty{font-size:14px;color:var(--muted)}

  .sec{margin-top:22px}
  .sec h2{font-size:17px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:10px}
  .sec h2::before{content:"";width:10px;height:10px;background:var(--teal);transform:rotate(45deg);border-radius:2px}
  .list{display:grid;gap:10px}
  .card{display:flex;gap:12px;background:var(--card);border-radius:16px;padding:10px;align-items:center;cursor:pointer;box-shadow:0 2px 10px rgba(17,74,107,.06);border:1px solid transparent;transition:border-color .15s,transform .1s}
  .card:active{transform:scale(.985)}
  .card .ph{width:76px;height:76px;flex:none;border-radius:12px;background:var(--teal-soft) center/cover;display:grid;place-items:center;color:var(--blue)}
  .card .tx{min-width:0;flex:1}
  .card b{display:block;font-size:15px;line-height:1.45}
  .card small{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}
  .card .badge{flex:none;text-align:center;background:var(--teal-soft);color:var(--blue);border-radius:12px;padding:6px 8px;min-width:48px}
  .card .badge b{font-size:18px;line-height:1}
  .card .badge span{font-size:11px}
  .note{font-size:11px;color:#c07a00}
  .empty{color:var(--muted);font-size:14px}

  footer{margin-top:auto;background:#fff;border-top:1px solid var(--line);padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  footer .wrap{display:flex;align-items:center;justify-content:center;gap:10px}
  footer img{width:40px;height:40px;filter:drop-shadow(0 3px 8px rgba(255,171,34,.45))}
  footer span{font-size:12.5px;color:var(--muted);line-height:1.3}
  footer b{display:block;color:var(--text);font-size:14px}

  /* نافذة الدعوة: من تحت في الجوال */
  .modal{position:fixed;inset:0;background:rgba(9,35,50,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
  .modal.open{opacity:1;pointer-events:auto}
  .sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom)}
  .modal.open .sheet{transform:none}
  .grab{width:44px;height:5px;border-radius:3px;background:#d5dee3;margin:8px auto 0}
  .sh{display:flex;align-items:center;gap:10px;padding:10px 16px 12px;border-bottom:1px solid var(--line)}
  .sh b{flex:1;font-size:16px}
  .x{width:38px;height:38px;border-radius:50%;border:0;background:var(--teal-soft);color:var(--blue);font-size:17px;cursor:pointer}
  .sb{overflow:auto;-webkit-overflow-scrolling:touch}
  .item{padding:16px}
  .item+.item{border-top:1px solid var(--line)}
  .item h3{font-size:18px;font-weight:800;line-height:1.4}
  .item .d{color:var(--muted);font-size:13px;margin:4px 0 12px}
  .item img{width:100%;border-radius:14px;display:block}
  .item iframe{width:100%;height:65vh;border:1px solid var(--line);border-radius:14px}
  .acts{display:flex;gap:8px;margin-top:12px}
  .btn{flex:1;height:46px;border-radius:12px;border:0;font-weight:700;font-size:14.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
  .btn.wa{background:#25d366;color:#fff}
  .btn.sec2{background:var(--teal-soft);color:var(--blue)}
  .btn svg{width:18px;height:18px}
  .loading{height:220px;border-radius:14px;background:linear-gradient(90deg,#eef3f5,#e2eaee,#eef3f5);background-size:200% 100%;animation:sh 1.2s infinite;display:grid;place-items:center;color:var(--muted);font-size:13px}
  @keyframes sh{to{background-position:-200% 0}}
  .pic img{width:100%;border-radius:12px;display:block}
  .pic img.ph-img{filter:blur(3px);opacity:.8}
  .dgrid{display:grid;gap:12px;padding:12px}
  .dgrid .item{border:1px solid var(--line);border-radius:16px;padding:12px}
  .dgrid .item+.item{border-top:1px solid var(--line)}
  .dgrid .item h3{font-size:15.5px}
  .dgrid .pic{cursor:zoom-in}

  /* الحالات والملاحظات */
  .st{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:999px;margin-inline-start:6px;vertical-align:2px;white-space:nowrap}
  .st.c{background:#fde8e8;color:#c62828}
  .st.p{background:#fff1d9;color:#a35f00}
  .card.cx b.t{text-decoration:line-through;text-decoration-color:rgba(198,40,40,.55)}
  .card.cx .ph{filter:grayscale(.85);opacity:.55}
  .enote{font-size:13px;color:#6d4500;background:#fff6e5;border-radius:10px;padding:8px 11px;margin-top:8px;line-height:1.55;white-space:pre-line}
  .enote.c{background:#fdecec;color:#9b1c1c}
  .card .enote{font-size:12px;padding:5px 8px;margin-top:5px}
  .dots i.cx{background:#e53935}
  .dayx{background:#fdecec;color:#9b1c1c;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:10px;line-height:1.7}
  .dayx.p{background:#fff1d9;color:#7a4700}
  .dayx b{font-weight:800}
  .modal .dayx{margin:12px 16px 0}
  .pic{position:relative}
  .ribbon{position:absolute;top:14px;right:-4px;background:#c62828;color:#fff;font-weight:800;font-size:14px;padding:6px 16px;border-radius:8px 0 0 8px;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:1}
  .ribbon.p{background:#e08a00}
  .tcard{border-radius:14px;background:linear-gradient(140deg,var(--blue-dark),var(--blue) 60%,var(--mid));color:#fff;padding:26px 20px;min-height:220px;display:flex;flex-direction:column;gap:10px;justify-content:center;position:relative;overflow:hidden}
  .tcard::after{content:"";position:absolute;width:120px;height:120px;left:-40px;bottom:-40px;background:var(--teal);opacity:.25;transform:rotate(45deg);border-radius:20px}
  .tcard h4{font-size:21px;font-weight:800;line-height:1.45}
  .tcard div{font-size:14.5px;opacity:.92;position:relative;z-index:1}
  .tcard small{font-size:12px;opacity:.7}
  .cx .tcard{filter:grayscale(.6)}

  /* وضع الإدارة */
  .adminbar{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:14px;z-index:15;display:flex;gap:8px}
  .adminbar[hidden],.ed[hidden]{display:none}
  .abtn{height:46px;border-radius:14px;border:0;padding:0 16px;font-weight:800;font-size:14px;background:var(--orange);color:#3a2600;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer}
  .abtn.ghost{background:#fff;color:var(--blue)}
  .btn.adm{background:#fff1d9;color:#7a4700}
  .btn.del{background:#fdecec;color:#9b1c1c}
  .frm{padding:14px 16px 18px}
  .frm label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px;font-weight:500}
  .frm input,.frm select,.frm textarea{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-family:inherit;font-size:15px;background:#fff;color:var(--text)}
  .frm textarea{height:84px;padding:10px 12px;resize:vertical}
  .frm .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .frm .chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--text)}
  .frm .chk input{width:20px;height:20px}
  .frm .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .frm .acts{flex-wrap:wrap}
  .ed{margin-top:8px;border:1px dashed #c9d6dc;border-radius:12px;padding:8px;background:#f8fafb}
  .ed canvas{max-width:100%;display:block;margin:0 auto;border-radius:8px;touch-action:none;cursor:crosshair}
  .tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tools button{height:38px;border-radius:10px;border:0;background:var(--teal-soft);color:var(--blue);font-weight:700;font-size:13px;padding:0 11px;cursor:pointer;font-family:inherit}
  .tools button.on{background:var(--blue);color:#fff}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#16303d;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
  .err{color:#c62828;font-size:13px;margin-top:8px;min-height:18px}

  /* شاشات أكبر */
  @media(min-width:760px){
    .topbar img{height:52px}
    .hero{padding:30px 0 80px}
    .feat .ph{width:120px;height:120px}
    .feat h2{font-size:24px}
    .day{height:96px;align-items:stretch;padding:6px;border-radius:0;border-top:1px solid var(--line)}
    .day .n{width:28px;height:28px;font-size:14px}
    .day .top{display:flex;align-items:center;gap:4px}
    .dots{display:none}
    .chips{display:block;margin-top:4px}
    .chips div{font-size:11px;background:var(--blue);color:#fff;border-radius:6px;padding:3px 6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .chips div.more{background:var(--teal);color:#06343b}
    .chips div.cx{background:#e57373;text-decoration:line-through}
    .chips div.pp{background:#f0a030}
    .day.sel{background:var(--teal-soft)}
    .day.sel .n{background:var(--blue)}
    .list{grid-template-columns:1fr 1fr}
    .modal{align-items:center;padding:24px}
    .sheet{border-radius:22px;transform:translateY(20px) scale(.98)}
    .grab{display:none}
    .sheet.wide{max-width:1100px}
    .dgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .dgrid .pic{height:440px;background:#f6f8f9;border-radius:12px;overflow:hidden}
    .dgrid .pic img{height:100%;object-fit:contain}
  }
</style>
</head>

  var ADMIN = null;

  function key(d){ return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); }

  // يدمج فعاليات درايف مع الفعاليات الثابتة وتعديلات الإدارة عليها
  function mergeEvents(r){
    var ov = {}, list = [];

    STATIC.forEach(function(s){
      var o = ov[s.id], e = {};

      if (o){
        if (o.hidden) return;
        ['title','date','status','note','time','place'].forEach(function(k){ if (o[k]) e[k] = o[k]; });
        if (o.end) e.end = o.end === '-' ? null : o.end;

  function fid(e){ return (e && e.poster) || (e && e.id); }

  // ملخص الملغاة والمؤجلة في يوم معيّن

  // يقرأ تواريخ الدعوات الجديدة في الخلفية، ويحدّث الصفحة لو تغيّر شي

      .withFailureHandler(function(){ scanning = false; })

  // الصور المصغرة: فقط اللي تظهر على الشاشة، ثلاث طلبات بنفس الوقت
  var thumbQueue = [], thumbActive = 0, redrawT = null;
  function loadThumbs(){
    var todayK = key(new Date());
    var want = EVENTS.filter(function(e){ return lastDay(e) >= todayK; })
      .concat(EVENTS.filter(function(e){ return lastDay(e) < todayK; }).reverse().slice(0, 6))
      .concat(BY_DATE[sel] || []);
    want.forEach(function(e){
      if (!e.isImage || e.thumb || THUMBS[e.id] || e.loadingThumb) return;
      if (e.isStatic && !e.poster) return;
      e.loadingThumb = true;
      thumbQueue.push(e.id);

  }
  function pumpThumbs(){
    while (thumbActive < 3 && thumbQueue.length){

  // أعلى الصفحة: أقرب الفعاليات الجارية والقادمة (حتى 8)، تتبدل كل 5 ثواني
  var heroIdx = 0, heroIds = '', heroTimer = null, heroAnim = false;

  function renderHero(){
    var list = heroList(), todayK = key(new Date());
    var ids = list.map(function(e){ return e.id; }).join(',');

      '<div><h2>' + esc(next.title) + '</h2><p>' + (next.end ? 'من ' + fFull.format(parse(next.date)) + '<br>إلى ' + fFull.format(parse(next.end)) : fFull.format(parse(next.date)) + '<br>' + fHFull.format(parse(next.date))) + '</p><span class="pill">' + (next.date < todayK ? 'جارية حتى ' + fDM.format(parse(next.end)) : when(next.date)) + '</span></div></div>';

  // تحميل الدعوات القادمة مسبقاً في الخلفية، عشان تفتح فوراً عند الضغط
  var WAIT = {}, preQ = [], preActive = 0;
  function getFileC(id, ok, fail){
    var se = find(id);

    if (CACHE[id]) return ok(CACHE[id]);
    if (WAIT[id]) { WAIT[id].push([ok, fail]); return; }
    WAIT[id] = [[ok, fail]];
    google.script.run
      .withSuccessHandler(function(r){ CACHE[id] = r; var w = WAIT[id]; delete WAIT[id]; w.forEach(function(c){ c[0](r); }); })
      .withFailureHandler(function(err){ var w = WAIT[id]; delete WAIT[id]; w.forEach(function(c){ if (c[1]) c[1](err); }); })
      .getFile(fid(se) || id);
  }
  function prefetch(){

  function render(){
    var y = cur.getFullYear(), m = cur.getMonth();
    var first = new Date(y, m, 1), last = new Date(y, m+1, 0);

    var html = DOW.map(function(d){ return '<div class="dow">' + d + '</div>'; }).join('');
    var start = new Date(y, m, 1 - first.getDay());
    var cells = Math.ceil((first.getDay() + last.getDate()) / 7) * 7;
    var todayK = key(new Date());
    for (var i = 0; i < cells; i++){
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      var k = key(d), evs = BY_DATE[k] || [];
      var cls = 'day' + (d.getMonth() !== m ? ' out' : '') + (k === todayK ? ' today' : '') + (k === sel ? ' sel' : '');

  // دعوة وحدة: عرض كامل. أكثر من دعوة: تحت بعض في الجوال، وثلاث جنب بعض في الكمبيوتر.
  // كل دعوة تنحمّل لما توصل لها، وتظهر صورتها المصغرة فوراً لين تجهز النسخة الواضحة.
  var observer = null;
  function openEvents(list, title){

        '<div class="pic" id="c_' + e.id + '">' + rib + (e.isText ? textCard(e) : e.thumb ? '<img class="ph-img" src="' + e.thumb + '" alt="">' : '<div class="loading">جاري تحميل الدعوة…</div>') + '</div>' +
        noteBox(e) +
        '<div class="acts"><a class="btn wa" target="_blank" href="https://wa.me/?text=' + encodeURIComponent(msg) + '">' + WA_ICON + 'مشاركة واتساب</a>' +
        (ADMIN ? '<button class="btn adm" data-edit="' + e.id + '">تعديل</button>' : '') + '</div></div>';

    document.querySelectorAll('#mBody [data-edit]').forEach(function(b){
      b.onclick = function(){ openEditor(find(b.getAttribute('data-edit'))); };
    });
    document.getElementById('modal').classList.add('open');
    document.body.style.overflow = 'hidden';
    var body = document.getElementById('mBody');
    body.scrollTop = 0;
    if (observer) observer.disconnect();

      body.querySelectorAll('.pic').forEach(function(p){

      observer = new IntersectionObserver(function(entries){

  function fill(e){

      } else if (r.type === 'html'){
        box.innerHTML = '';
        var f = document.createElement('iframe');

      } else {
        box.innerHTML = rib + '<img src="' + r.content + '" alt="' + esc(e.title) + '">';
      }
    };
    getFileC(e.id, show, function(){
      var box = document.getElementById('c_' + e.id);
      if (box) box.innerHTML = '<div class="empty">تعذر تحميل الدعوة، أعد المحاولة.</div>';
    });
  }

  /* ---------- وضع الإدارة ---------- */
  // يفتح بإضافة #admin لرابط الموقع. كلمة المرور تنحفظ في هذا المتصفح لين تسجّل خروج.
  function toast(t){ var el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove('on'); }, 2600); }
  function apiPost(b){
    b.pw = b.pw || ADMIN;
    if (typeof API_URL !== 'undefined'){
      return fetch(API_URL, { method: 'POST', body: JSON.stringify(b), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit' })
        .then(function(r){ return r.json(); })
        .then(function(d){ if (d && d.error) throw new Error(d.error); return d; });
    }
    return new Promise(function(ok, no){
      google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){ no(new Error(e && e.message || e)); }).adminCall(b);
    });
  }
  function store(k, v){ try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function stored(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
  function openSheet(title, html){
    document.getElementById('sheet').classList.remove('wide');
    document.getElementById('mTitle').textContent = title;
    document.getElementById('mBody').innerHTML = html;
    document.getElementById('modal').classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('mBody').scrollTop = 0;
  }
  function enterAdmin(pw){
    ADMIN = pw; store('jcci_admin', pw);
    document.getElementById('adminbar').hidden = false;
    if (sel) renderAgenda();
  }
  function loginForm(msg){
    openSheet('دخول الإدارة', '<div class="frm"><label>كلمة المرور</label><input type="password" id="fPw" autocomplete="current-password">' +
      '<div class="err" id="fErr">' + (msg || '') + '</div><div class="acts"><button class="btn sec2" id="fGo">دخول</button></div></div>');
    var go = function(){
      var pw = document.getElementById('fPw').value;
      document.getElementById('fErr').textContent = 'جاري التحقق…';
      apiPost({ action: 'login', pw: pw }).then(function(){ enterAdmin(pw); closeModal(); toast('أهلاً، وضع الإدارة مفعّل'); })
        .catch(function(e){ document.getElementById('fErr').textContent = e.message; });
    };
    document.getElementById('fGo').onclick = go;
    document.getElementById('fPw').onkeydown = function(ev){ if (ev.key === 'Enter') go(); };
    setTimeout(function(){ document.getElementById('fPw').focus(); }, 250);
  }
  function adminMenu(){
    openSheet('الإدارة', '<div class="frm"><label>تغيير كلمة المرور</label><input type="password" id="fNew" placeholder="كلمة المرور الجديدة (6 أحرف على الأقل)">' +
      '<div class="err" id="fErr"></div><div class="acts"><button class="btn sec2" id="fChg">حفظ كلمة المرور</button><button class="btn del" id="fOut">تسجيل خروج</button></div>' +
      '<div class="hint">لإضافة فعالية: زر "فعالية جديدة"، أو افتح يوم في التقويم واضغط "إضافة فعالية في هذا اليوم". لتعديل أو إلغاء فعالية: افتحها واضغط "تعديل".</div></div>');
    document.getElementById('fChg').onclick = function(){
      var n = document.getElementById('fNew').value;
      apiPost({ action: 'password', newPw: n }).then(function(){ enterAdmin(n); closeModal(); toast('تم تغيير كلمة المرور'); })
        .catch(function(e){ document.getElementById('fErr').textContent = e.message; });
    };
    document.getElementById('fOut').onclick = function(){
      ADMIN = null; store('jcci_admin', null); document.getElementById('adminbar').hidden = true; closeModal(); renderAgenda(); toast('تم تسجيل الخروج');
    };
  }

  // نموذج الإضافة والتعديل
  var ED = null;   // محرر البوستر
  function openEditor(e, day){
    var isNew = !e;
    e = e || { title: '', date: day || key(new Date()), end: null, status: '', note: '', time: '', place: '' };
    var h = '<div class="frm">' +
      '<label>اسم الفعالية</label><input id="fT" value="' + esc(e.title || '') + '">' +
      '<div class="row2"><div><label>من تاريخ</label><input type="date" id="fD" value="' + (e.date || '') + '"></div>' +
      '<div><label>إلى تاريخ (اختياري)</label><input type="date" id="fE" value="' + (e.end || '') + '"></div></div>' +
      '<div class="row2"><div><label>الوقت (اختياري)</label><input id="fTm" placeholder="مثال: 10 صباحاً" value="' + esc(e.time || '') + '"></div>' +
      '<div><label>المكان (اختياري)</label><input id="fPl" value="' + esc(e.place || '') + '"></div></div>' +
      '<label>الحالة</label><select id="fS"><option value="">قائمة</option><option value="cancelled"' + (e.status === 'cancelled' ? ' selected' : '') + '>ملغاة</option><option value="postponed"' + (e.status === 'postponed' ? ' selected' : '') + '>مؤجلة</option></select>' +
      '<label>ملاحظة تظهر للموظفين (اختياري)</label><textarea id="fN" placeholder="مثال: تم إلغاء الفعالية حسب إيميل الجهة المنظمة">' + esc(e.note || '') + '</textarea>' +
      '<label>البوستر</label><input type="file" id="fF" accept="image/*">' +
      '<div class="hint">' + (isNew ? 'بدون بوستر؟ اتركه فاضي وتظهر الفعالية ببطاقة نصية.' : 'اختر صورة جديدة لاستبدال البوستر، أو عدّل البوستر الحالي.') + '</div>' +
      (!isNew && e.isImage ? '<div class="acts"><button class="btn sec2" id="fCur">تعديل البوستر الحالي</button></div>' : '') +
      '<div class="ed" id="fEd" hidden><canvas id="fCv"></canvas><div class="tools">' +
        '<button data-t="rot">تدوير</button><button data-t="crop">قص</button><button data-t="cx">ختم ملغاة</button><button data-t="pp">ختم مؤجلة</button><button data-t="reset">إرجاع</button><button data-t="drop">بدون صورة جديدة</button>' +
      '</div><div class="hint">للقص: اضغط "قص" ثم اسحب على الصورة لتحديد الجزء، واضغط "قص" مرة ثانية للتطبيق.</div></div>' +
      (isNew ? '<label class="chk"><input type="checkbox" id="fW" checked> في الموقع فقط (ما يدخل التقويم ولا فولدر الدعوات)</label>' : '') +
      '<div class="err" id="fErr"></div>' +
      '<div class="acts"><button class="btn sec2" id="fSave">' + (isNew ? 'إضافة' : 'حفظ التعديل') + '</button>' +
      (!isNew ? '<button class="btn del" id="fDel">حذف من الموقع</button>' : '') + '</div>' +
      (!isNew ? '<div class="acts"><button class="btn adm" id="fReset">إرجاع الفعالية لأصلها</button></div>' : '') +
      '</div>';
    openSheet(isNew ? 'فعالية جديدة' : 'تعديل الفعالية', h);
    ED = null;
    document.getElementById('fF').onchange = function(ev){
      var f = ev.target.files[0]; if (!f) return;
      var rd = new FileReader(); rd.onload = function(){ startEditor(rd.result); }; rd.readAsDataURL(f);
    };
    var cb = document.getElementById('fCur');
    if (cb) cb.onclick = function(){
      cb.textContent = 'جاري التحميل…';
      getFileC(e.id, function(r){ if (r.type === 'image') startEditor(r.content); else cb.textContent = 'لا يمكن تعديل هذا النوع'; }, function(){ cb.textContent = 'تعذر التحميل'; });
    };
    document.querySelectorAll('#fEd [data-t]').forEach(function(b){ b.onclick = function(){ edTool(b.getAttribute('data-t'), b); }; });
    var err = function(t){ document.getElementById('fErr').textContent = t; };
    document.getElementById('fSave').onclick = function(){
      var data = {
        title: document.getElementById('fT').value.trim(), date: document.getElementById('fD').value,
        end: document.getElementById('fE').value || '-', time: document.getElementById('fTm').value.trim(),
        place: document.getElementById('fPl').value.trim(), status: document.getElementById('fS').value,
        note: document.getElementById('fN').value.trim()
      };
      if (!data.title || !data.date) return err('اكتب اسم الفعالية والتاريخ');
      if (data.end !== '-' && data.end < data.date) return err('تاريخ النهاية قبل البداية');
      if (data.end === data.date) data.end = '-';
      var img = ED && ED.changed ? edExport() : null;
      var btn = this; btn.disabled = true; btn.textContent = 'جاري الحفظ…'; err('');
      var req = isNew ? { action: 'add', data: data, image: img, webOnly: document.getElementById('fW').checked }
                      : { action: 'save', id: e.id, data: data, image: img };
      apiPost(req).then(function(){
        if (!isNew){ delete CACHE[e.id]; delete THUMBS[e.id]; }
        closeModal(); toast(isNew ? 'تمت إضافة الفعالية' : 'تم حفظ التعديل');
        sel = data.date; var d = parse(data.date); cur = new Date(d.getFullYear(), d.getMonth(), 1);
        load();
      }).catch(function(x){ btn.disabled = false; btn.textContent = 'حفظ'; err(x.message); });
    };
    var del = document.getElementById('fDel');
    if (del) del.onclick = function(){
      if (del.getAttribute('data-sure') !== '1'){ del.setAttribute('data-sure', '1'); del.textContent = 'اضغط مرة ثانية للتأكيد'; return; }
      apiPost({ action: 'delete', id: e.id }).then(function(){ closeModal(); toast('تم حذفها من الموقع'); load(); }).catch(function(x){ err(x.message); });
    };
    var rs = document.getElementById('fReset');
    if (rs) rs.onclick = function(){
      apiPost({ action: 'reset', id: e.id }).then(function(){ delete CACHE[e.id]; delete THUMBS[e.id]; closeModal(); toast('رجعت الفعالية لأصلها'); load(); }).catch(function(x){ err(x.message); });
    };
  }

  // محرر البوستر: تدوير وقص وختم
  function startEditor(src){
    var im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = function(){
      var c = document.createElement('canvas'), s = Math.min(1, 1600 / Math.max(im.width, im.height));
      c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      ED = { orig: c, work: cloneC(c), crop: null, cropping: false, changed: true };
      document.getElementById('fEd').hidden = false;
      edDraw(); edBind();
    };
    im.onerror = function(){ document.getElementById('fErr').textContent = 'تعذر فتح الصورة'; };
    im.src = src;
  }
  function cloneC(c){ var n = document.createElement('canvas'); n.width = c.width; n.height = c.height; n.getContext('2d').drawImage(c, 0, 0); return n; }
  function edDraw(){
    var cv = document.getElementById('fCv'); if (!cv || !ED) return;
    cv.width = ED.work.width; cv.height = ED.work.height;
    var g = cv.getContext('2d'); g.drawImage(ED.work, 0, 0);
    if (ED.crop){
      var r = ED.crop; g.fillStyle = 'rgba(0,0,0,.45)';
      g.fillRect(0, 0, cv.width, r.y); g.fillRect(0, r.y + r.h, cv.width, cv.height - r.y - r.h);
      g.fillRect(0, r.y, r.x, r.h); g.fillRect(r.x + r.w, r.y, cv.width - r.x - r.w, r.h);
      g.strokeStyle = '#2ec0c9'; g.lineWidth = Math.max(2, cv.width / 300); g.strokeRect(r.x, r.y, r.w, r.h);
    }
  }
  function edBind(){
    var cv = document.getElementById('fCv'), p0 = null;
    var pt = function(ev){ var b = cv.getBoundingClientRect(); return { x: (ev.clientX - b.left) * cv.width / b.width, y: (ev.clientY - b.top) * cv.height / b.height }; };
    cv.onpointerdown = function(ev){ if (!ED.cropping) return; p0 = pt(ev); cv.setPointerCapture(ev.pointerId); };
    cv.onpointermove = function(ev){ if (!p0) return; var p = pt(ev); ED.crop = { x: Math.min(p0.x, p.x), y: Math.min(p0.y, p.y), w: Math.abs(p.x - p0.x), h: Math.abs(p.y - p0.y) }; edDraw(); };
    cv.onpointerup = function(){ p0 = null; };
  }
  function edTool(t, btn){
    if (!ED) return;
    var w = ED.work;
    if (t === 'rot'){
      var n = document.createElement('canvas'); n.width = w.height; n.height = w.width;
      var g = n.getContext('2d'); g.translate(n.width, 0); g.rotate(Math.PI / 2); g.drawImage(w, 0, 0);
      ED.work = n; ED.crop = null;
    } else if (t === 'crop'){
      if (!ED.cropping){ ED.cropping = true; btn.classList.add('on'); btn.textContent = 'تطبيق القص'; return; }
      ED.cropping = false; btn.classList.remove('on'); btn.textContent = 'قص';
      var r = ED.crop; ED.crop = null;
      if (r && r.w > 20 && r.h > 20){
        var c = document.createElement('canvas'); c.width = Math.round(r.w); c.height = Math.round(r.h);
        c.getContext('2d').drawImage(w, r.x, r.y, r.w, r.h, 0, 0, c.width, c.height);
        ED.work = c;
      }
    } else if (t === 'cx' || t === 'pp'){
      var g2 = w.getContext('2d'), W = w.width, H = w.height, band = Math.max(W, H) * 0.11;
      g2.save(); g2.translate(W / 2, H / 2); g2.rotate(-Math.atan2(H, W) * 0.55);
      g2.fillStyle = t === 'cx' ? 'rgba(198,40,40,.92)' : 'rgba(224,138,0,.92)';
      g2.fillRect(-W * 1.2, -band / 2, W * 2.4, band);
      g2.fillStyle = '#fff'; g2.textAlign = 'center'; g2.textBaseline = 'middle';
      g2.font = '800 ' + Math.round(band * 0.6) + 'px Tajawal, sans-serif';
      g2.fillText(t === 'cx' ? 'تم الإلغاء' : 'تم التأجيل', 0, band * 0.04);
      g2.restore();
    } else if (t === 'reset'){
      ED.work = cloneC(ED.orig); ED.crop = null;
    } else if (t === 'drop'){
      ED = null; document.getElementById('fEd').hidden = true; document.getElementById('fF').value = ''; return;
    }
    ED.changed = true; edDraw();
  }
  function edExport(){ return ED.work.toDataURL('image/jpeg', 0.88); }

  document.getElementById('aAdd').onclick = function(){ openEditor(null, sel); };
  document.getElementById('aMenu').onclick = adminMenu;
  (function(){
    if (/admin/.test(location.hash + location.search)){
      var pw = stored('jcci_admin');
      if (pw) apiPost({ action: 'login', pw: pw }).then(function(){ enterAdmin(pw); }).catch(function(){ loginForm(); });
      else loginForm();
    }
  })();

  function closeModal(){ document.getElementById('modal').classList.remove('open'); document.body.style.overflow = ''; }
  function shift(n){ cur = new Date(cur.getFullYear(), cur.getMonth() + n, 1); render(); }
  document.getElementById('close').onclick = closeModal;
  document.getElementById('modal').onclick = function(ev){ if (ev.target.id === 'modal') closeModal(); };
  document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape') closeModal(); });
  document.getElementById('prev').onclick = function(){ shift(-1); };
  document.getElementById('next').onclick = function(){ shift(1); };
  document.getElementById('todayBtn').onclick = function(){ cur = new Date(); cur.setDate(1); sel = key(new Date()); render(); };

  // سحب بالإصبع لتغيير الشهر (يمين لليسار = الشهر التالي في العربي)
  (function(){
    var g = document.getElementById('grid'), x0 = null, y0 = null;
    g.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
    g.addEventListener('touchend', function(e){
      if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) shift(dx > 0 ? 1 : -1);
      x0 = null;
    });
  })();

  // سحب النافذة لتحت لإغلاقها في الجوال
  (function(){
    var sh = document.getElementById('sheet'), y0 = null;
    sh.querySelector('.sh').addEventListener('touchstart', function(e){ y0 = e.touches[0].clientY; }, {passive:true});
    sh.querySelector('.sh').addEventListener('touchend', function(e){ if (y0 !== null && e.changedTouches[0].clientY - y0 > 60) closeModal(); y0 = null; });
  })();

  load();
  setInterval(load, 5 * 60 * 1000);
</script>
</body>
